name: CI/CD - Test and Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code (Source)
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run the tests (Build + Test)
        run: mvn -B package

      - name: Make the website folder
        run: |
          mkdir -p _site
          cp -r site/* _site/
          {
            echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>Test results</title></head><body>"
            echo "<h1>Latest test results</h1>"
            echo "<p>Commit: ${GITHUB_SHA}</p>"
            echo "<p>Built on: $(date -u)</p>"
            echo "<pre>"
            cat target/surefire-reports/*.txt
            echo "</pre>"
            echo "<p><a href='index.html'>Back to home</a></p>"
            echo "</body></html>"
          } > _site/test-results.html

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
